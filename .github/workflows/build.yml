name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Verifier le plugin
        run: |
          nm -gU build/HandwritingCinema90s2000s.ofx.bundle/Contents/MacOS/HandwritingCinema90s2000s.ofx | grep -i ofx

      - name: Zipper
        run: ditto -c -k --keepParent build/HandwritingCinema90s2000s.ofx.bundle HandwritingCinema.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HandwritingCinema
          path: HandwritingCinema.zip
